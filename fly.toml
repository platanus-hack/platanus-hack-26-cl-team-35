app = "agent-board-mvp0-604e"
primary_region = "iad"

[env]
  PORT = "8080"
  DB_PATH = "/data/agentrooms.db"
  # Demo: cualquiera que instale el cliente puede crear cuartos, sin aprobación del admin. Quita esta línea para volver a aprobar a mano.
  OPEN_SIGNUP = "1"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
