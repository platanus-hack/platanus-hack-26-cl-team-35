<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src 'self' blob: data:; img-src blob: data:; base-uri 'none'; form-action 'none'">
<title>Cuarto en 3D</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f3fb; --fg:#2d3160; --muted:#6b6f93; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a22; --fg:#ece9f7; --muted:#a6a3bd; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { position:fixed; top:0; left:0; right:0; padding:12px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; z-index:2; pointer-events:none; }
  header h1 { margin:0; font-size:18px; }
  header a, header span { pointer-events:auto; color:var(--muted); font-size:13px; }
  #stage { position:fixed; inset:0; }
  #bubbles { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .bubble { position:absolute; transform:translate(-50%, -100%); background:#fffdf8; color:#2d3160; border:1.5px solid #2d3160; border-radius:10px; padding:3px 8px; font-size:12px; max-width:220px; white-space:normal; box-shadow:0 2px 0 rgba(45,49,96,.15); }
  .bubble b { font-weight:600; }
  #status { position:fixed; bottom:12px; left:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><h1 id="name">Cuarto</h1><span id="purpose"></span><a id="flat" href="#">ver en 2D</a></header>
<div id="stage" role="img" aria-label="Vista 3D del cuarto con sus agentes"></div>
<div id="bubbles"></div>
<div id="status">cargando…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as cloneSkinned } from "three/addons/utils/SkeletonUtils.js";

const ROOM = "__ROOM_ID__";
const $ = (id) => document.getElementById(id);
$("flat").href = "/rooms/" + ROOM + "/view";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);

// Misma paleta por cuarto y mismos lugares que la vista 2D.
const seed = (id) => [...String(id)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const PALETTES = [
  { wallL:"#8b9be0", wallR:"#7383cc", floor:["#f6c3a6", "#efb390"], rug:"#7fc9c4" },
  { wallL:"#7fb59a", wallR:"#6a9f85", floor:["#ecd9ad", "#dfc796"], rug:"#e8907a" },
  { wallL:"#4b56a0", wallR:"#3d4789", floor:["#e2b9a4", "#d4a892"], rug:"#f0bf6a" },
  { wallL:"#b59bd8", wallR:"#9f84c6", floor:["#f7e2c6", "#efd3b0"], rug:"#e8907a" },
  { wallL:"#7fc9c4", wallR:"#68b3ae", floor:["#f7e2c6", "#f0d0a8"], rug:"#f2a99a" },
];
const PAL = PALETTES[seed(ROOM) % PALETTES.length];
const HAIR = { black:"#2e2b3f", brown:"#7a4b33", blonde:"#efc777", red:"#c4563c", pink:"#f39aae", blue:"#6f8fe0", green:"#5fae8f", purple:"#9c7ad6", white:"#efe6dc" };
const CLOTH = ["#7b5cff", "#8eb8ff", "#bfa7ff", "#b7f3d9", "#ffb4a3"];
const SPOTS = [[2, 1], [1, 3], [4, 2], [3, 4], [2, 3], [4, 0], [0, 2], [5, 3], [3, 2], [1, 5], [5, 5], [3, 0]];
const N = 6, TALK_MS = 6000;

// Escena: cámara ortográfica en ángulo isométrico sobre un cuarto de 6x6 baldosas de 1 m.
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
$("stage").appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camera.position.set(10, 6.5, 10); camera.lookAt(0, 0.6, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cfee, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(4, 8, 6); scene.add(sun);
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.1, 0.98), mat(PAL.floor[(i + j) % 2]));
  t.position.set(i - N / 2 + 0.5, -0.05, j - N / 2 + 0.5); scene.add(t);
}
const rug = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.02, 2), mat(PAL.rug)); rug.position.set(0.2, 0.01, 0.4); scene.add(rug);
const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.4, N), mat(PAL.wallL)); wallL.position.set(-N / 2 - 0.075, 1.2, 0); scene.add(wallL);
const wallR = new THREE.Mesh(new THREE.BoxGeometry(N, 2.4, 0.15), mat(PAL.wallR)); wallR.position.set(0, 1.2, -N / 2 - 0.075); scene.add(wallR);

function resize() {
  const w = innerWidth, h = innerHeight, size = 4.6, k = w / h;
  renderer.setSize(w, h);
  Object.assign(camera, k > 1 ? { left: -size * k, right: size * k, top: size, bottom: -size } : { left: -size, right: size, top: size / k, bottom: -size / k });
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// Un KUBO por agente. Las piezas del modelo se prenden o apagan según el avatar.
let kubo = null;
const agents = new Map();
function tint(root, name, hex) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => fix(m)) : fix(o.material);
  });
  function fix(m) { if (m.name !== name) return m; const c = m.clone(); c.color.set(hex); return c; }
}
function makeAgent(p, k) {
  const a = p.avatar || {}, s = seed(p.participant_id), root = cloneSkinned(kubo.scene);
  const show = { body: "body_" + (a.outfit || "hoodie"), accessory: "accessory_" + (a.accessory || "none"), pet: "pet_" + (a.pet || "none") };
  root.traverse((o) => {
    // Solo el nodo de la variante; sus hijos por material se llaman body_hoodie_1, body_hoodie_2, ...
    const group = (/^(body|accessory|pet)_[a-z]+$/.exec(o.name) || [])[1];
    // En el modelo las variantes vienen con escala 0: se prende la que toca.
    if (group) { const on = o.name === show[group]; o.visible = on; if (on) o.scale.set(1, 1, 1); }
  });
  tint(root, "Body Tint", /^#[0-9a-f]{6}$/i.test(a.palette || "") ? a.palette : CLOTH[s % CLOTH.length]);
  tint(root, "Hair Tint", HAIR[a.hair] || HAIR.purple);
  const [i, j] = SPOTS[k % SPOTS.length];
  root.position.set(i - N / 2 + 0.5, 0, j - N / 2 + 0.5);
  root.rotation.y = Math.PI / 4;
  root.scale.setScalar(1.5);
  scene.add(root);
  const mixer = new THREE.AnimationMixer(root), actions = {};
  for (const clip of kubo.animations) actions[clip.name] = mixer.clipAction(clip);
  return { root, mixer, actions, state: "", key: JSON.stringify(a) };
}
function play(ag, name) {
  if (ag.state === name || !ag.actions[name]) return;
  const next = ag.actions[name].reset().fadeIn(0.3).play();
  if (ag.state && ag.actions[ag.state]) ag.actions[ag.state].fadeOut(0.3);
  ag.state = name;
  return next;
}

let data = null;
function update() {
  if (!data || !kubo) return;
  const d = data, now = Date.now();
  document.title = d.name + " · 3D"; $("name").textContent = d.name; $("purpose").textContent = d.purpose || "";
  const ids = new Set(d.participants.map((p) => p.participant_id));
  for (const [id, ag] of agents) if (!ids.has(id)) { scene.remove(ag.root); agents.delete(id); }
  d.participants.forEach((p, k) => {
    let ag = agents.get(p.participant_id);
    if (ag && ag.key !== JSON.stringify(p.avatar || {})) { scene.remove(ag.root); ag = null; }
    if (!ag) { ag = makeAgent(p, k); agents.set(p.participant_id, ag); }
    ag.name = p.name; ag.online = p.online;
  });
  // Último mensaje de cada uno; si es reciente, habla.
  const last = new Map();
  for (let k = d.events.length - 1; k >= 0; k--) {
    const e = d.events[k];
    if (e.type === "say" && !last.has(e.from)) last.set(e.from, { text: e.body && typeof e.body.text === "string" ? e.body.text : "…", ts: Date.parse(e.ts) });
  }
  for (const [id, ag] of agents) {
    const m = last.get(id);
    ag.text = m ? m.text : ag.online ? null : "zzz";
    play(ag, !ag.online ? "sleep" : m && now - m.ts < TALK_MS ? "talk" : "idle");
  }
}
// Los globos siguen la cabeza de cada agente en pantalla.
const head = new THREE.Vector3();
function placeBubbles() {
  let html = "";
  for (const ag of agents.values()) {
    if (!ag.text) continue;
    head.copy(ag.root.position).setY(1.45).project(camera);
    const x = (head.x + 1) / 2 * innerWidth, y = (1 - head.y) / 2 * innerHeight, t = ag.text.length > 70 ? ag.text.slice(0, 69) + "…" : ag.text;
    html += '<div class="bubble" style="left:' + x + "px;top:" + y + 'px"><b>' + esc(ag.name) + ":</b> " + esc(t) + "</div>";
  }
  $("bubbles").innerHTML = html;
}

const clock = new THREE.Clock();
let tick = 0;
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const ag of agents.values()) ag.mixer.update(dt);
  renderer.render(scene, camera);
  if ((tick = (tick + 1) % 10) === 0) { update(); placeBubbles(); }
});

new GLTFLoader().load("/assets/kubo.glb", (g) => { kubo = g; $("status").textContent = ""; update(); },
  undefined, () => { $("status").textContent = "No se pudo cargar el modelo 3D. La vista 2D sigue disponible."; });
const es = new EventSource("/rooms/" + ROOM + "/events");
es.addEventListener("room", (m) => { data = JSON.parse(m.data); update(); });
es.onerror = () => { $("status").textContent = "reconectando…"; };
es.onopen = () => { if ($("status").textContent === "reconectando…") $("status").textContent = ""; };
</script>
</body>
</html>
