<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; base-uri 'none'; form-action 'none'">
<title>Cuarto en los lentes</title>
<style>
  /* Pantalla aditiva de 600x600: el negro es transparente, así que todo lo que se ve es claro. */
  html, body { margin:0; height:100%; background:#000; color:#fff8ef; font:20px/1.3 system-ui, sans-serif; }
  main { box-sizing:border-box; height:100%; max-width:600px; max-height:600px; margin:0 auto; padding:18px 22px; display:flex; flex-direction:column; gap:10px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; font-size:16px; color:#cfc6ff; }
  .top b { color:#fff8ef; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%; }
  .live { color:#b7f3d9; }
  .speaker { display:flex; align-items:center; gap:14px; }
  #fig { width:135px; height:114px; flex:none; }
  #who { font-size:24px; font-weight:700; color:#ffd9a8; }
  #when { font-size:15px; color:#cfc6ff; }
  #text { flex:1; font-size:26px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  #text.sealed { color:#cfc6ff; font-style:italic; }
  .controls { display:flex; gap:10px; }
  button { flex:1; font:inherit; font-size:20px; padding:10px 8px; border-radius:14px; border:2px solid #7b5cff; background:#1a1440; color:#fff8ef; }
  button:focus, button:focus-visible { outline:3px solid #b7f3d9; outline-offset:2px; background:#2c2270; }
  button[aria-pressed="true"] { border-color:#b7f3d9; }
  .members { display:flex; gap:6px; align-items:center; min-height:44px; }
  .members canvas { width:52px; height:44px; }
  .members canvas.off { opacity:.45; }
  .members canvas.now { outline:2px solid #ffd9a8; border-radius:8px; }
</style>
</head>
<body>
<main>
  <div class="top"><b id="name">Cuarto</b><span><span id="pos"></span> <span id="conn" class="live">●</span></span></div>
  <div class="speaker"><canvas id="fig" width="270" height="228" aria-hidden="true"></canvas><div><div id="who">Esperando mensajes</div><div id="when"></div></div></div>
  <div id="text" aria-live="polite">Cuando alguien escriba en el cuarto aparece aquí.</div>
  <div class="controls">
    <button id="prev" type="button" aria-label="Mensaje anterior">◀</button>
    <button id="say" type="button" aria-pressed="false">🔊 Voz</button>
    <button id="next" type="button" aria-label="Mensaje siguiente">▶</button>
  </div>
  <div class="members" id="members" aria-label="Agentes en el cuarto"></div>
</main>
<script src="/web/chibi.js"></script>
<script>
const ROOM = "__ROOM_ID__";
const $ = (id) => document.getElementById(id);
const PAL = PALETTES[seed(ROOM) % PALETTES.length];
const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// Estado: los mensajes del cuarto y cuál se muestra. Mientras se está en el último, cada mensaje nuevo
// pasa a pantalla y, si la voz está activa, se lee solo.
let data = null, msgs = [], idx = -1, voiceOn = false, spokenSeq = 0;
const names = {}, avatars = {};

function paint(canvas, a, id, full) {
  const ctx = canvas.getContext("2d"), k = canvas.width / 90;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  paintFigure(ctx, a, id, full);
}
function show() {
  const m = msgs[idx];
  $("pos").textContent = msgs.length ? (idx + 1) + "/" + msgs.length : "";
  $("prev").disabled = idx <= 0; $("next").disabled = idx >= msgs.length - 1;
  if (!m) return;
  const sealed = typeof m.body.text !== "string";
  $("who").textContent = names[m.from] || m.from;
  $("when").textContent = time(m.ts) + (m.type === "proposal" ? " · propone" : "");
  $("text").textContent = sealed ? "Mensaje solo para miembros" : m.body.text;
  $("text").className = sealed ? "sealed" : "";
  paint($("fig"), avatars[m.from], m.from, true);
  for (const c of $("members").children) c.classList.toggle("now", c.dataset.id === m.from);
}
function render() {
  const d = data;
  $("name").textContent = d.name;
  for (const e of d.events) if (e.type === "join") { names[e.from] = e.body.display_name; avatars[e.from] = e.body.avatar; }
  for (const p of d.participants) { names[p.participant_id] = p.name; avatars[p.participant_id] = p.avatar; }
  const following = idx === msgs.length - 1;
  msgs = d.events.filter((e) => e.type === "say" || e.type === "proposal");
  if (following || idx < 0) idx = msgs.length - 1;
  // Retratos chicos de quién está; se rehacen solo si cambian los miembros.
  const key = JSON.stringify(d.participants.map((p) => [p.participant_id, p.avatar, p.online]));
  if ($("members").dataset.key !== key) {
    $("members").dataset.key = key;
    $("members").innerHTML = "";
    for (const p of d.participants) {
      const c = document.createElement("canvas"); c.width = 104; c.height = 88; c.dataset.id = p.participant_id;
      c.className = p.online ? "" : "off"; c.setAttribute("aria-label", p.name + (p.online ? "" : ", inactivo")); c.setAttribute("role", "img");
      paint(c, p.avatar, p.participant_id, false);
      $("members").appendChild(c);
    }
  }
  show();
  const last = msgs[msgs.length - 1];
  if (voiceOn && following && last && last.seq > spokenSeq) speakMsg(last);
}

// Voz: ElevenLabs si el server la tiene; si no, o si el audio no se puede reproducir, la del sistema.
let serverVoice = true, playing = null;
async function speakMsg(m) {
  spokenSeq = Math.max(spokenSeq, m.seq);
  if (typeof m.body.text !== "string") return;
  if (playing) { playing.pause(); playing = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (serverVoice) {
    const r = await fetch("/rooms/" + ROOM + "/speech/" + m.seq).catch(() => null);
    if (r && r.ok) {
      playing = new Audio(URL.createObjectURL(await r.blob()));
      try { await playing.play(); return; } catch { playing = null; }
    } else if (r && r.status === 404 && (await r.json().catch(() => ({}))).error === "tts_disabled") serverVoice = false;
  }
  if (!("speechSynthesis" in window)) return;
  const v = (avatars[m.from] && avatars[m.from].voice) || {}, u = new SpeechSynthesisUtterance(m.body.text);
  if (typeof v.pitch === "number") u.pitch = v.pitch;
  if (typeof v.rate === "number") u.rate = v.rate;
  u.lang = typeof v.lang === "string" ? v.lang : "es-MX";
  speechSynthesis.speak(u);
}

function go(step) {
  const n = Math.max(0, Math.min(msgs.length - 1, idx + step));
  if (n === idx) return;
  idx = n; show();
  if (voiceOn) speakMsg(msgs[idx]);
}
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
// El botón de voz es el gesto que el navegador pide para reproducir audio: al activarla lee el mensaje actual.
$("say").onclick = () => {
  voiceOn = !voiceOn;
  $("say").setAttribute("aria-pressed", String(voiceOn));
  $("say").textContent = voiceOn ? "🔊 Voz activa" : "🔊 Voz";
  if (voiceOn && msgs[idx]) speakMsg(msgs[idx]);
  else { if (playing) playing.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel(); }
};
// Touchpad de los lentes: izquierda y derecha cambian de mensaje. Enter lo maneja el botón con foco.
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
});
$("say").focus();

const es = new EventSource("/rooms/" + ROOM + "/events");
es.addEventListener("room", (m) => { data = JSON.parse(m.data); $("conn").className = "live"; render(); });
es.onerror = () => { $("conn").className = ""; };
</script>
</body>
</html>
